name: Redfin
description: Redfin is a technology-powered real estate brokerage that provides property
  search, home value estimates, listing details, neighborhood statistics, commute
  data, and downloadable housing market data across the United States. Their platform
  exposes a Stingray REST API used by the Redfin website and mobile apps, a GIS CSV
  Export endpoint for bulk property downloads, and the Redfin Data Center for time-series
  housing market statistics at national, metro, state, county, city, ZIP code, and
  neighborhood levels.
tags:
- CSV Export
- GIS
- Home Values
- Housing Market
- Listings
- Property Data
- Real Estate

naftiko: 1.0.0-alpha2
info:
  label: Redfin Stingray API — Market Trends
  description: 'Redfin Stingray API — Market Trends. 2 operations. Lead operation: Get aggregated regional market trends.
    Self-contained Naftiko capability covering one Redfin business surface.'
  tags:
  - Redfin
  - Market Trends
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    REDFIN_API_KEY: REDFIN_API_KEY
capability:
  consumes:
  - type: http
    namespace: stingray-market-trends
    baseUri: https://www.redfin.com/stingray
    description: Redfin Stingray API — Market Trends business capability. Self-contained, no shared references.
    resources:
    - name: api-region-regionType-regionId-code-aggregate-trends
      path: /api/region/{regionType}/{regionId}/{code}/aggregate-trends
      operations:
      - name: getregionaggregatetrends
        method: GET
        description: Get aggregated regional market trends
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: regionType
          in: path
          type: string
          description: The type of region (e.g., neighborhood, zipcode, city, county).
          required: true
        - name: regionId
          in: path
          type: integer
          description: The unique identifier for the region.
          required: true
        - name: code
          in: path
          type: string
          description: The region code.
          required: true
    - name: api-region-regionType-regionId-code-trends
      path: /api/region/{regionType}/{regionId}/{code}/trends
      operations:
      - name: getregiontrends
        method: GET
        description: Get regional market trends
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: regionType
          in: path
          type: string
          description: The type of region (e.g., neighborhood, zipcode, city, county).
          required: true
        - name: regionId
          in: path
          type: integer
          description: The unique identifier for the region.
          required: true
        - name: code
          in: path
          type: string
          description: The region code.
          required: true
  exposes:
  - type: rest
    namespace: stingray-market-trends-rest
    port: 8080
    description: REST adapter for Redfin Stingray API — Market Trends. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api/region/{regiontype}/{regionid}/{code}/aggregate-trends
      name: api-region-regiontype-regionid-code-aggregate-trends
      description: REST surface for api-region-regionType-regionId-code-aggregate-trends.
      operations:
      - method: GET
        name: getregionaggregatetrends
        description: Get aggregated regional market trends
        call: stingray-market-trends.getregionaggregatetrends
        with:
          regionType: rest.regionType
          regionId: rest.regionId
          code: rest.code
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/region/{regiontype}/{regionid}/{code}/trends
      name: api-region-regiontype-regionid-code-trends
      description: REST surface for api-region-regionType-regionId-code-trends.
      operations:
      - method: GET
        name: getregiontrends
        description: Get regional market trends
        call: stingray-market-trends.getregiontrends
        with:
          regionType: rest.regionType
          regionId: rest.regionId
          code: rest.code
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: stingray-market-trends-mcp
    port: 9090
    transport: http
    description: MCP adapter for Redfin Stingray API — Market Trends. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: get-aggregated-regional-market-trends
      description: Get aggregated regional market trends
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: stingray-market-trends.getregionaggregatetrends
      with:
        regionType: tools.regionType
        regionId: tools.regionId
        code: tools.code
      outputParameters:
      - type: object
        mapping: $.
    - name: get-regional-market-trends
      description: Get regional market trends
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: stingray-market-trends.getregiontrends
      with:
        regionType: tools.regionType
        regionId: tools.regionId
        code: tools.code
      outputParameters:
      - type: object
        mapping: $.

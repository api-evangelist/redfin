reconciled: false
tags:
  - FinOps
  - FOCUS
  - Real Estate
  - Property Data
description: FinOps shape for Redfin programmatic data partnerships. Redfin does not publish self-serve
  API pricing; spend is governed by the partner contract and any FinOps allocation must be derived from
  invoices supplied by Redfin under that contract.
sources:
  - https://www.redfin.com/news/data-center-metrics-definitions/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Redfin Corporation
serviceCategory: Real Estate Data
billingModel:
  pricingCategory: Contact Sales
  billingFrequency: Per-Invoice
  billingCurrency: USD
  chargeCategories:
    - Purchase
focusColumns:
  ServiceName: Redfin
  ServiceCategory: Real Estate Data
  ProviderName: Redfin
  PublisherName: Redfin Corporation
  InvoiceIssuerName: Redfin Corporation
  BillingCurrency: USD
meters:
  - name: contract_term
    unit: month
    aggregation: sum
principles:
  - name: Visibility
    description: Track Redfin partnership invoices and any agreed usage reports; no public usage API
      exists, so visibility relies on contractual reporting.
  - name: Allocation
    description: Allocate Redfin partnership cost to the consuming product line; without per-call telemetry
      use the contract's negotiated unit (per-feed, per-region) as the allocation key.
  - name: Optimization
    description: Optimization is contractual — renegotiate scope, geography, and refresh cadence at renewal
      rather than tuning request volume.
  - name: Accountability
    description: Owner is the partnership/data team that signed the Redfin contract; renewals and scope
      changes go through that owner.
notes: No public pricing or usage API; FinOps shape reflects a contract-driven data partnership rather
  than a metered API. Generic meters/columns removed.

description: Redfin does not publish a public, self-serve developer API or pricing for its Stingray, GIS
  CSV Export, or Data Center surfaces. Public housing-market datasets are released as downloadable CSVs
  via the Redfin Data Center; programmatic access for partners and MLS integrations is handled through
  direct partnerships rather than a published commercial plan.
sources:
  - https://www.redfin.com/news/data-center-metrics-definitions/
notes: No public pricing page or self-serve plans were found. Real-estate brokerage and MLS partnerships
  are negotiated directly. The single Contact Sales plan reflects that gating; no fabricated tiers retained.
plans:
  - id: redfin-contact-sales
    name: Contact Sales
    type: enterprise
    description: All Redfin programmatic access (data partnerships, broker integrations, MLS feeds, Data
      Center licensing) is arranged through direct contact with Redfin. No published list price.
    entries:
      - label: Programmatic Access
        name: programmatic_access
        type: flat
        metric: varies
        limit: -1
        timeFrame: usage
        geo: US
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: Data Partnerships
      - name: Custom Integration
      - name: Negotiated Terms
